<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        ESP32-S3 NFC + BLE 控制台
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background-color: #f4f6f9;

            margin: 0;

            padding: 20px;

            display: flex;

            justify-content: center;
        }


        .container {

            background: #ffffff;

            max-width: 480px;

            width: 100%;

            padding: 25px;

            border-radius: 16px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.08);
        }


        h2 {

            margin-top: 0;

            color: #333;

            text-align: center;
        }


        .section {

            margin-top: 20px;

            padding-top: 20px;

            border-top: 1px solid #eeeeee;
        }


        .section-title {

            font-size: 15px;

            font-weight: bold;

            margin-bottom: 10px;

            color: #444;
        }


        /* =========================================
           Status
           ========================================= */

        .status-box {

            padding: 12px;

            border-radius: 8px;

            text-align: center;

            font-weight: bold;

            margin-bottom: 20px;

            background-color: #ffebee;

            color: #c62828;
        }


        .status-box.connected {

            background-color: #e8f5e9;

            color: #2e7d32;
        }


        .status-box.scanning {

            background-color: #fff8e1;

            color: #f57f17;
        }


        /* =========================================
           Buttons
           ========================================= */

        button {

            width: 100%;

            padding: 12px;

            font-size: 16px;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;

            margin-bottom: 10px;

            transition: 0.2s;
        }


        button:disabled {

            opacity: 0.45;

            cursor: not-allowed;
        }


        .btn-nfc {

            background-color: #ff9500;

            color: white;
        }


        .btn-nfc:hover {

            background-color: #e68600;
        }


        .btn-connect {

            background-color: #007aff;

            color: white;
        }


        .btn-connect:hover {

            background-color: #0056b3;
        }


        .btn-disconnect {

            background-color: #757575;

            color: white;
        }


        .btn-send {

            background-color: #34c759;

            color: white;
        }


        .btn-nfc-send {

            background-color: #af52de;

            color: white;
        }


        .btn-stop {

            background-color: #ff3b30;

            color: white;
        }


        /* =========================================
           NFC Result
           ========================================= */

        .nfc-result {

            background-color: #f5f5f5;

            padding: 12px;

            border-radius: 8px;

            font-family: monospace;

            font-size: 13px;

            word-break: break-all;

            margin-top: 10px;

            line-height: 1.7;
        }


        /* =========================================
           Input
           ========================================= */

        .input-group {

            display: flex;

            gap: 8px;

            margin-top: 15px;
        }


        input[type="text"] {

            flex: 1;

            padding: 10px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 14px;

            min-width: 0;
        }


        .input-group button {

            width: auto;

            margin-bottom: 0;

            white-space: nowrap;
        }


        /* =========================================
           Log
           ========================================= */

        .log-box {

            margin-top: 20px;

            background: #1e1e1e;

            color: #00ff66;

            font-family: monospace;

            padding: 12px;

            border-radius: 8px;

            height: 250px;

            overflow-y: auto;

            font-size: 12px;

            white-space: pre-wrap;
        }


        /* =========================================
           Info
           ========================================= */

        .info {

            font-size: 13px;

            color: #666;

            line-height: 1.6;

            margin-top: 8px;
        }


        code {

            background: #eeeeee;

            padding: 2px 5px;

            border-radius: 4px;

            font-family: monospace;
        }

    </style>

</head>


<body>


<div class="container">


    <h2>
        ESP32-S3 NFC + BLE
    </h2>


    <!-- =====================================================
         Status
         ===================================================== -->

    <div
        id="status"
        class="status-box"
    >
        未連線
    </div>


    <!-- =====================================================
         NFC
         ===================================================== -->

    <div class="section">

        <div class="section-title">

            ① NFC 設備識別

        </div>


        <button
            id="btnNFC"
            class="btn-nfc"
            onclick="startNFC()"
        >
            開始 NFC 掃描
        </button>


        <button
            id="btnStopNFC"
            class="btn-stop"
            onclick="stopNFC()"
            style="display:none;"
        >
            停止 NFC 掃描
        </button>


        <div class="nfc-result">

            <strong>
                NFC 狀態：
            </strong>

            <span id="nfcStatus">
                尚未掃描
            </span>


            <br>


            <strong>
                設備名稱：
            </strong>

            <span id="nfcDeviceName">
                -
            </span>


            <br>


            <strong>
                NFC 原始資料：
            </strong>

            <span id="nfcRaw">
                -
            </span>

        </div>


        <div class="info">

            NFC Tag 建議先寫入：

            <br>

            <code>
                ESP32S3_BLE_Test
            </code>

        </div>


        <br>


        <button
            id="btnSendNFC"
            class="btn-nfc-send"
            onclick="sendNFCData()"
            disabled
        >
            發送 NFC 內容給 ESP32
        </button>

    </div>


    <!-- =====================================================
         BLE
         ===================================================== -->

    <div class="section">

        <div class="section-title">

            ② BLE 連線

        </div>


        <button
            id="btnConnect"
            class="btn-connect"
            onclick="connectBLE()"
        >
            搜尋並連線 ESP32-S3
        </button>


        <button
            id="btnDisconnect"
            class="btn-disconnect"
            onclick="disconnectBLE()"
            style="display:none;"
        >
            斷開藍牙連線
        </button>


        <div class="info">

            NFC 讀取成功後，

            再按下「搜尋並連線 ESP32-S3」。

        </div>

    </div>


    <!-- =====================================================
         BLE Send
         ===================================================== -->

    <div class="section">

        <div class="section-title">

            ③ 發送文字

        </div>


        <div class="input-group">

            <input
                type="text"
                id="sendInput"
                placeholder="輸入文字傳給 ESP32..."
                disabled
            >


            <button
                id="btnSend"
                class="btn-send"
                onclick="sendData()"
                disabled
            >
                發送
            </button>

        </div>


        <div class="info">

            手機 → ESP32-S3

            <br>

            ESP32-S3 只接收，不回傳。

        </div>

    </div>


    <!-- =====================================================
         Log
         ===================================================== -->

    <div class="section">

        <div class="section-title">

            Debug Log

        </div>


        <div
            class="log-box"
            id="logConsole"
        >
            等待操作中...
        </div>

    </div>


</div>


<script>


// ============================================================
// BLE UUID
// ============================================================

const SERVICE_UUID =
    "4fafc201-1fb5-459e-8fcc-c5c9c331914b";


const CHARACTERISTIC_UUID =
    "beb5483e-36e1-4688-b7f5-ea07361b26a8";


// ============================================================
// Global Variables
// ============================================================

let bleDevice = null;

let gattServer = null;

let bleCharacteristic = null;

let nfcReader = null;

let nfcScanning = false;

let targetDeviceName = null;

let nfcContent = "";


// ============================================================
// Log
// ============================================================

function log(text) {

    const consoleBox =
        document.getElementById(
            "logConsole"
        );


    const now =
        new Date().toLocaleTimeString();


    consoleBox.innerText +=
        `[${now}] ${text}\n`;


    consoleBox.scrollTop =
        consoleBox.scrollHeight;
}


// ============================================================
// Update UI
// ============================================================

function updateUI(isConnected) {

    const statusBox =
        document.getElementById(
            "status"
        );


    const btnConnect =
        document.getElementById(
            "btnConnect"
        );


    const btnDisconnect =
        document.getElementById(
            "btnDisconnect"
        );


    const sendInput =
        document.getElementById(
            "sendInput"
        );


    const btnSend =
        document.getElementById(
            "btnSend"
        );


    const btnSendNFC =
        document.getElementById(
            "btnSendNFC"
        );


    if (isConnected) {

        statusBox.innerText =
            "已成功連線至 ESP32-S3";


        statusBox.classList.remove(
            "scanning"
        );


        statusBox.classList.add(
            "connected"
        );


        btnConnect.style.display =
            "none";


        btnDisconnect.style.display =
            "block";


        sendInput.disabled =
            false;


        btnSend.disabled =
            false;


        // NFC 有資料才可以發送

        btnSendNFC.disabled =
            nfcContent.length === 0;

    }

    else {

        statusBox.innerText =
            "未連線";


        statusBox.classList.remove(
            "connected"
        );


        statusBox.classList.remove(
            "scanning"
        );


        btnConnect.style.display =
            "block";


        btnDisconnect.style.display =
            "none";


        sendInput.disabled =
            true;


        btnSend.disabled =
            true;


        btnSendNFC.disabled =
            true;
    }
}


// ============================================================
// NFC
// ============================================================

async function startNFC() {


    // --------------------------------------------------------
    // 檢查 Web NFC
    // --------------------------------------------------------

    if (!("NDEFReader" in window)) {

        alert(
            "這個瀏覽器不支援 Web NFC。\n\n" +
            "請使用支援 Web NFC 的 Android Chrome，" +
            "並確認網站使用 HTTPS。"
        );


        log(
            "錯誤：瀏覽器不支援 Web NFC"
        );


        return;
    }


    if (nfcScanning) {

        log(
            "NFC 已經正在掃描"
        );

        return;
    }


    try {

        nfcReader =
            new NDEFReader();


        await nfcReader.scan();


        nfcScanning = true;


        document.getElementById(
            "btnNFC"
        ).style.display =
            "none";


        document.getElementById(
            "btnStopNFC"
        ).style.display =
            "block";


        document.getElementById(
            "nfcStatus"
        ).innerText =
            "等待 NFC Tag...";


        log(
            "NFC 掃描已開始"
        );


        log(
            "請把手機靠近 NFC Tag"
        );


        // ----------------------------------------------------
        // NFC Reading
        // ----------------------------------------------------

        nfcReader.addEventListener(
            "reading",
            ({ message, serialNumber }) => {


                log(
                    ">>> 偵測到 NFC Tag"
                );


                if (serialNumber) {

                    log(
                        "NFC Serial Number: " +
                        serialNumber
                    );
                }


                let detectedName = null;

                let rawData = [];


                // ------------------------------------------------
                // 讀取 NDEF Records
                // ------------------------------------------------

                for (
                    const record of message.records
                ) {


                    log(
                        "NDEF Record Type: " +
                        record.recordType
                    );


                    // --------------------------------------------
                    // Text Record
                    // --------------------------------------------

                    if (
                        record.recordType ===
                        "text"
                    ) {

                        try {

                            const text =
                                record.data
                                    ? new TextDecoder(
                                        record.encoding ||
                                        "utf-8"
                                    ).decode(
                                        record.data
                                    )
                                    : "";


                            const cleanText =
                                text.trim();


                            log(
                                "NFC Text: " +
                                cleanText
                            );


                            rawData.push(
                                cleanText
                            );


                            if (
                                cleanText.length > 0
                            ) {

                                detectedName =
                                    cleanText;
                            }

                        }

                        catch (error) {

                            log(
                                "Text Record 讀取失敗：" +
                                error
                            );
                        }

                    }


                    // --------------------------------------------
                    // URL Record
                    // --------------------------------------------

                    else if (
                        record.recordType ===
                        "url"
                    ) {

                        try {

                            const url =
                                record.data
                                    ? new TextDecoder()
                                        .decode(
                                            record.data
                                        )
                                    : "";


                            log(
                                "NFC URL: " +
                                url
                            );


                            rawData.push(
                                url
                            );


                            detectedName =
                                url;

                        }

                        catch (error) {

                            log(
                                "URL Record 讀取失敗：" +
                                error
                            );
                        }

                    }


                    // --------------------------------------------
                    // Unknown Record
                    // --------------------------------------------

                    else {

                        try {

                            if (
                                record.data
                            ) {

                                const data =
                                    new Uint8Array(
                                        record.data
                                    );


                                const hex =
                                    Array.from(
                                        data
                                    )
                                    .map(
                                        b =>
                                            b
                                                .toString(16)
                                                .padStart(
                                                    2,
                                                    "0"
                                                )
                                    )
                                    .join(" ");


                                rawData.push(
                                    hex
                                );
                            }

                        }

                        catch (error) {

                            log(
                                "未知 NFC Record 讀取失敗"
                            );
                        }
                    }
                }


                // ------------------------------------------------
                // NFC Result
                // ------------------------------------------------

                if (detectedName) {

                    targetDeviceName =
                        detectedName;


                    nfcContent =
                        detectedName;


                    document.getElementById(
                        "nfcStatus"
                    ).innerText =
                        "NFC 偵測成功";


                    document.getElementById(
                        "nfcDeviceName"
                    ).innerText =
                        targetDeviceName;


                    document.getElementById(
                        "nfcRaw"
                    ).innerText =
                        rawData.join(
                            " | "
                        );


                    log(
                        "NFC 內容：" +
                        nfcContent
                    );


                    log(
                        "NFC 設備名稱：" +
                        targetDeviceName
                    );


                    // 如果 BLE 已連線
                    // 啟用發送 NFC 按鈕

                    if (
                        bleDevice &&
                        bleDevice.gatt &&
                        bleDevice.gatt.connected
                    ) {

                        document.getElementById(
                            "btnSendNFC"
                        ).disabled =
                            false;
                    }


                    log(
                        "NFC 讀取完成"
                    );

                }

                else {

                    log(
                        "NFC Tag 沒有找到文字資料"
                    );
                }

            }
        );


        // ----------------------------------------------------
        // NFC Error
        // ----------------------------------------------------

        nfcReader.addEventListener(
            "readingerror",
            () => {

                log(
                    "NFC 讀取錯誤"
                );


                document.getElementById(
                    "nfcStatus"
                ).innerText =
                    "讀取失敗";
            }
        );

    }

    catch (error) {

        log(
            "NFC 啟動失敗：" +
            error
        );


        document.getElementById(
            "nfcStatus"
        ).innerText =
            "NFC 啟動失敗";


        nfcScanning = false;
    }
}


// ============================================================
// Stop NFC
// ============================================================

function stopNFC() {

    nfcScanning = false;


    document.getElementById(
        "btnNFC"
    ).style.display =
        "block";


    document.getElementById(
        "btnStopNFC"
    ).style.display =
        "none";


    document.getElementById(
        "nfcStatus"
    ).innerText =
        "已停止";


    log(
        "NFC 掃描停止"
    );
}


// ============================================================
// BLE Connect
// ============================================================

async function connectBLE() {


    // --------------------------------------------------------
    // Browser Support
    // --------------------------------------------------------

    if (!navigator.bluetooth) {

        alert(
            "你的瀏覽器不支援 Web Bluetooth。"
        );


        log(
            "錯誤：瀏覽器不支援 Web Bluetooth"
        );


        return;
    }


    try {

        log(
            "正在搜尋 BLE 裝置..."
        );


        // ----------------------------------------------------
        // NFC 已經取得設備名稱
        // ----------------------------------------------------

        if (targetDeviceName) {

            log(
                "NFC 指定設備：" +
                targetDeviceName
            );


            try {

                bleDevice =
                    await navigator.bluetooth.requestDevice({

                        filters: [
                            {
                                name:
                                    targetDeviceName
                            }
                        ],

                        optionalServices: [
                            SERVICE_UUID
                        ]
                    });

            }

            catch (nameFilterError) {

                log(
                    "名稱搜尋失敗"
                );


                log(
                    "改用 Service UUID 搜尋..."
                );


                bleDevice =
                    await navigator.bluetooth.requestDevice({

                        filters: [
                            {
                                services: [
                                    SERVICE_UUID
                                ]
                            }
                        ]
                    });
            }

        }

        else {

            log(
                "沒有 NFC 設備名稱"
            );


            log(
                "使用 Service UUID 搜尋 BLE..."
            );


            bleDevice =
                await navigator.bluetooth.requestDevice({

                    filters: [
                        {
                            services: [
                                SERVICE_UUID
                            ]
                        }
                    ]
                });
        }


        // ----------------------------------------------------
        // Device
        // ----------------------------------------------------

        if (!bleDevice) {

            log(
                "沒有選擇 BLE 裝置"
            );


            return;
        }


        log(
            "找到裝置：" +
            (
                bleDevice.name ||
                "未知名稱"
            )
        );


        // ----------------------------------------------------
        // Disconnect Event
        // ----------------------------------------------------

        bleDevice.addEventListener(
            "gattserverdisconnected",
            onDisconnected
        );


        // ----------------------------------------------------
        // GATT Connect
        // ----------------------------------------------------

        log(
            "正在連線至 GATT Server..."
        );


        gattServer =
            await bleDevice.gatt.connect();


        log(
            "GATT Server 連線成功"
        );


        // ----------------------------------------------------
        // Service
        // ----------------------------------------------------

        log(
            "正在取得 BLE Service..."
        );


        const service =
            await gattServer.getPrimaryService(
                SERVICE_UUID
            );


        log(
            "BLE Service OK"
        );


        // ----------------------------------------------------
        // Characteristic
        // ----------------------------------------------------

        log(
            "正在取得 BLE Characteristic..."
        );


        bleCharacteristic =
            await service.getCharacteristic(
                CHARACTERISTIC_UUID
            );


        log(
            "BLE Characteristic OK"
        );


        // ----------------------------------------------------
        // 成功
        // ----------------------------------------------------

        log(
            "================================"
        );


        log(
            ">>> BLE 連線成功！"
        );


        log(
            ">>> 手機現在可以發送文字"
        );


        log(
            ">>> ESP32-S3 只接收資料"
        );


        log(
            "================================"
        );


        updateUI(true);

    }

    catch (error) {

        log(
            "BLE 連線失敗：" +
            error
        );


        updateUI(false);
    }
}


// ============================================================
// Send Text
//
// 手機 → ESP32
// ============================================================

async function sendData() {


    const input =
        document.getElementById(
            "sendInput"
        );


    const text =
        input.value.trim();


    if (!text) {

        log(
            "不能發送空白文字"
        );


        return;
    }


    if (!bleCharacteristic) {

        log(
            "BLE 尚未連線"
        );


        return;
    }


    try {

        const encoder =
            new TextEncoder();


        const data =
            encoder.encode(text);


        // ----------------------------------------------------
        // BLE WRITE
        // ----------------------------------------------------

        await bleCharacteristic.writeValue(
            data
        );


        log(
            "📤 手機 → ESP32： " +
            text
        );


        log(
            "發送成功"
        );


        input.value = "";

    }

    catch (error) {

        log(
            "發送失敗：" +
            error
        );
    }
}


// ============================================================
// Send NFC Data
//
// NFC → 手機 → ESP32
// ============================================================

async function sendNFCData() {


    if (!nfcContent) {

        log(
            "沒有 NFC 資料可以發送"
        );


        return;
    }


    if (!bleCharacteristic) {

        log(
            "BLE 尚未連線"
        );


        return;
    }


    try {

        const encoder =
            new TextEncoder();


        const data =
            encoder.encode(
                nfcContent
            );


        await bleCharacteristic.writeValue(
            data
        );


        log(
            "📡 NFC → BLE → ESP32"
        );


        log(
            "發送 NFC 內容：" +
            nfcContent
        );


        log(
            "NFC 內容發送成功"
        );

    }

    catch (error) {

        log(
            "NFC 內容發送失敗：" +
            error
        );
    }
}


// ============================================================
// BLE Disconnect
// ============================================================

function disconnectBLE() {


    if (
        bleDevice &&
        bleDevice.gatt &&
        bleDevice.gatt.connected
    ) {

        log(
            "正在斷開 BLE..."
        );


        bleDevice.gatt.disconnect();
    }
}


// ============================================================
// BLE Disconnected
// ============================================================

function onDisconnected() {


    log(
        ">>> BLE 連線已中斷"
    );


    gattServer = null;

    bleCharacteristic = null;


    updateUI(false);
}


</script>


</body>

</html>
